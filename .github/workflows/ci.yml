name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov=firstlight

  build-smoke:
    # Proves the templates ship in the wheel: install the built wheel in a clean
    # venv, scaffold every stack, and run each generated project's own toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/firstlight --version
      - name: Scaffold and verify a Python project
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          /tmp/smoke-venv/bin/firstlight new smoke-py --stack python --no-input --no-git
          cd smoke-py
          python -m venv .venv && .venv/bin/pip install -e .[dev]
          .venv/bin/ruff check . && .venv/bin/ruff format --check . && .venv/bin/pytest
      - name: Scaffold and verify a Node/TypeScript project
        run: |
          cd /tmp/smoke
          /tmp/smoke-venv/bin/firstlight new smoke-ts --stack node --no-input --no-git
          cd smoke-ts
          npm install && npm run lint && npm run typecheck && npm test
      - name: Scaffold and verify a Go project
        run: |
          cd /tmp/smoke
          /tmp/smoke-venv/bin/firstlight new smoke-go --stack go --no-input --no-git
          cd smoke-go
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./... && go test ./...
