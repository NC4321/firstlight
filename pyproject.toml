[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firstlight"
dynamic = ["version"]
description = "Scaffold a new project — structure, README, license, CI, git — in one command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nathan", email = "nator.cobb@gmail.com" }]
keywords = ["scaffold", "bootstrap", "cli", "project-template", "generator"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "typer>=0.12",
  "jinja2>=3.1",
  "platformdirs>=4.0",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[project.scripts]
firstlight = "firstlight.cli:app"

[project.urls]
Homepage = "https://github.com/NC4321/firstlight"
Issues = "https://github.com/NC4321/firstlight/issues"

[tool.hatch.version]
path = "src/firstlight/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/firstlight"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/firstlight/templates"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["firstlight"]
omit = ["*/templates/*"]
